<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perm Quest Platform — TMA</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel для компиляции JSX на лету в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --tg-theme-bg-color: #0f172a;
            --tg-theme-text-color: #f8fafc;
            --tg-theme-secondary-bg-color: #1e293b;
            --tg-theme-button-color: #6366f1;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #94a3b8;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Стили для шторки сравнения фото Было/Стало */
        .slider-container {
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .slider-before {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #6366f1;
            cursor: ew-resize;
            z-index: 10;
        }
        .slider-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #6366f1;
            border: 3px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="p-0 m-0">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tg = window.Telegram?.WebApp;

        function App() {
            const [activeTab, setActiveTab] = useState("quest");
            const [profile, setProfile] = useState(null);
            const [quests, setQuests] = useState([]);
            const [activeQuest, setActiveQuest] = useState(null);
            const [inventory, setInventory] = useState({ items: [], current_weight: 0 });
            const [shop, setShop] = useState([]);
            const [leaderboard, setLeaderboard] = useState([]);
            const [leaderboardPeriod, setLeaderboardPeriod] = useState("global");
            const [loading, setLoading] = useState(true);
            
            // Очередь уведомлений (Стек уведомлений)
            const [notifications, setNotifications] = useState([]);
            
            // Состояния для игровых механик
            const [unlockedHints, setUnlockedHints] = useState({});
            const [timeElapsed, setTimeElapsed] = useState(0);
            const [showClassModal, setShowClassModal] = useState(false);

            const COIN_SYMBOL = "💎";
            const COIN_LABEL = "монет";

            // Состояние ракурса фото-слайдера
            const [sliderValue, setSliderValue] = useState(50);
            const sliderRef = useRef(null);
            const isDragging = useRef(false);

            // Имитация геолокации для тестирования
            const [mockGps, setMockGps] = useState(true);
            const [coords, setCoords] = useState({ latitude: 58.0097, longitude: 56.2444 });
            const [currentDistance, setCurrentDistance] = useState(null);

            const getHeaders = () => {
                const initData = tg?.initData || "user=%7B%22id%22%3A5748413499%2C%22first_name%22%3A%22%D0%94%D0%BC%D0%B8%D1%82%D1%80%D0%B8%D0%B9%22%2C%22username%22%3A%22dm_perm%22%7D&hash=mockhash";
                return {
                    "Content-Type": "application/json",
                    "X-Tg-Init-Data": initData
                };
            };

            // Функция добавления уведомления в очередь
            const triggerNotification = (text, type = "success") => {
                const id = Date.now() + Math.random();
                setNotifications(prev => [...prev, { id, text, type }]);
                // Уведомление исчезает через 7 секунд
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 7000);
            };

            useEffect(() => {
                if (tg) {
                    tg.ready();
                    tg.expand();
                }
                loadData();
            }, [activeTab]);

            // Таймер для подсказок
            useEffect(() => {
                let iv;
                if (activeQuest && activeQuest.time_passed_seconds !== undefined && activeQuest.gps_verified) {
                    setTimeElapsed(activeQuest.time_passed_seconds);
                    iv = setInterval(() => {
                        setTimeElapsed(prev => prev + 1);
                    }, 1000);
                }
                return () => clearInterval(iv);
            }, [activeQuest]);

            useEffect(() => {
                lucide.createIcons();
            });

            const loadData = async () => {
                setLoading(true);
                try {
                    const headers = getHeaders();
                    
                    const profRes = await fetch("/api/profile", { headers });
                    const profData = await profRes.json();
                    setProfile(profData);

                    const activeRes = await fetch("/api/quest/active", { headers });
                    const activeData = await activeRes.json();
                    setActiveQuest(activeData.active ? activeData : null);

                    if (activeTab === "quest" && !activeData.active) {
                        const questListRes = await fetch("/api/quests", { headers });
                        const questListData = await questListRes.json();
                        setQuests(questListData);
                    }

                    if (activeTab === "inventory") {
                        const invRes = await fetch("/api/inventory", { headers });
                        const invData = await invRes.json();
                        setInventory(invData);
                    }

                    if (activeTab === "shop") {
                        const shopRes = await fetch("/api/shop", { headers });
                        const shopData = await shopRes.json();
                        setShop(shopData);
                    }

                    if (activeTab === "rating") {
                        const rateRes = await fetch(`/api/leaderboard?period=${leaderboardPeriod}`, { headers });
                        const rateData = await rateRes.json();
                        setLeaderboard(rateData);
                    }

                } catch (error) {
                    console.error("Ошибка загрузки данных API:", error);
                    triggerNotification("Ошибка подключения к серверу VPS!", "error");
                }
                setLoading(false);
            };

            const handleTouchMove = (e) => {
                if (!sliderRef.current) return;
                const rect = sliderRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const offset = clientX - rect.left;
                let percentage = (offset / rect.width) * 100;
                if (percentage < 0) percentage = 0;
                if (percentage > 100) percentage = 100;
                setSliderValue(percentage);
            };

            const handleMouseDown = () => { isDragging.current = true; };
            const handleMouseUp = () => { isDragging.current = false; };
            const handleMouseMove = (e) => {
                if (isDragging.current) {
                    handleTouchMove(e);
                }
            };

            useEffect(() => {
                if (mockGps) return;
                const watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const userCoords = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        setCoords(userCoords);
                        if (activeQuest?.step) {
                            const dist = calculateHaversine(userCoords.latitude, userCoords.longitude, activeQuest.step.latitude, activeQuest.step.longitude);
                            setCurrentDistance(parseInt(dist));
                        }
                    },
                    (error) => {
                        triggerNotification("Не удалось получить реальный GPS сигнал!", "error");
                    },
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
                return () => navigator.geolocation.clearWatch(watchId);
            }, [mockGps, activeQuest]);

            const calculateHaversine = (lat1, lon1, lat2, lon2) => {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            };

            const startQuest = async (id) => {
                setLoading(true);
                try {
                    const res = await fetch(`/api/quest/start/${id}`, { method: "POST", headers: getHeaders() });
                    if (res.ok) {
                        triggerNotification("Квест успешно запущен!");
                        setUnlockedHints({});
                        await loadData();
                    } else {
                        const err = await res.json();
                        triggerNotification(err.detail, "error");
                    }
                } catch (e) { triggerNotification("Ошибка сети.", "error"); }
                setLoading(false);
            };

            // ФУНКЦИЯ ПРЕРЫВАНИЯ КВЕСТА С ПРЕДУПРЕЖДЕНИЕМ
            const exitQuest = async () => {
                const message = "🛑 Вы уверены, что хотите прервать квест?\n\nВЕСЬ прогресс и накопленные (условно) в этом квесте ресурсы сгорят безвозвратно!";
                
                const processExit = async (confirmed) => {
                    if (!confirmed) return;
                    setLoading(true);
                    try {
                        const res = await fetch("/api/quest/exit", {
                            method: "POST",
                            headers: getHeaders()
                        });
                        if (res.ok) {
                            const d = await res.json();
                            // Выводим детальное сообщение об утерянных ресурсах красным окном
                            triggerNotification(d.message, "error");
                            setActiveQuest(null);
                            loadData();
                        } else {
                            const d = await res.json();
                            triggerNotification(d.detail || "Произошла ошибка при выходе.", "error");
                        }
                    } catch (e) {
                        triggerNotification("Ошибка сети.", "error");
                    }
                    setLoading(false);
                };

                // Нативный попап Telegram WebApp или запасной браузерный confirm
                if (tg && tg.showConfirm) {
                    tg.showConfirm(message, processExit);
                } else {
                    processExit(window.confirm(message));
                }
            };

            const changeClass = async (cls) => {
                try {
                    const res = await fetch("/api/profile/change-class", {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify({ rpg_class: cls })
                    });
                    if (res.ok) {
                        triggerNotification("Класс успешно изменен!", "success");
                        setShowClassModal(false);
                        loadData();
                    } else {
                        const err = await res.json();
                        triggerNotification(err.detail, "error");
                    }
                } catch (e) {
                    triggerNotification("Ошибка сервера", "error");
                }
            };

            const claimIncome = async () => {
                try {
                    const res = await fetch("/api/profile/claim-income", { method: "POST", headers: getHeaders() });
                    const d = await res.json();
                    if (d.status === "success") {
                        triggerNotification(`Прибыль собрана: +${d.collected_coins} ${COIN_LABEL}`);
                        loadData();
                    }
                } catch (e) { triggerNotification("Ошибка транзакции.", "error"); }
            };

            const verifyPosition = async () => {
                try {
                    const res = await fetch("/api/quest/verify-location", {
                        method: "POST", headers: getHeaders(), body: JSON.stringify(coords)
                    });
                    const d = await res.json();
                    if (d.status === "success") {
                        triggerNotification("Вы успешно прибыли на точку квеста!", "success");
                        if (d.npc_started) {
                            triggerNotification("Здесь вас ждет персонаж!", "success");
                        }
                        loadData();
                    } else if (d.status === "too_far") {
                        triggerNotification(d.message, "error");
                    } else if (d.status === "banned" || d.status === "speed_warning") {
                        triggerNotification(d.message, "error");
                        loadData();
                    }
                } catch (e) { triggerNotification("Ошибка связи.", "error"); }
            };

            const [userAns, setUserAns] = useState("");
            const submitAnswer = async () => {
                if (!userAns) return;
                try {
                    const res = await fetch("/api/quest/submit-answer", {
                        method: "POST", headers: getHeaders(), body: JSON.stringify({ answer: userAns })
                    });
                    const d = await res.json();
                    if (d.status === "next_step") {
                        triggerNotification(d.message, "success");
                        setUserAns("");
                        setUnlockedHints({});
                        loadData();
                    } else if (d.status === "finished") {
                        triggerNotification(d.message, "success");
                        setUserAns("");
                        loadData();
                    } else if (d.status === "wrong") {
                        triggerNotification(d.message, "error");
                    }
                } catch (e) { triggerNotification("Ошибка обработки ответа.", "error"); }
            };

            const selectNpcChoice = async (idx) => {
                try {
                    const res = await fetch(`/api/quest/npc-choice/${idx}`, { method: "POST", headers: getHeaders() });
                    const d = await res.json();
                    
                    // Диалоги могут возвращать сообщение (в т.ч. о полученных монетах/карме)
                    if (d.message) {
                        triggerNotification(d.message, "success");
                    }
                    loadData();
                } catch (e) { triggerNotification("Ошибка взаимодействия.", "error"); }
            };

            const unlockHint = async (idx, isPaid) => {
                if (isPaid) {
                    try {
                        const res = await fetch(`/api/quest/buy-hint/${idx}`, {method:"POST", headers: getHeaders()});
                        if (!res.ok) {
                            const err = await res.json();
                            triggerNotification(err.detail, "error");
                            return;
                        }
                        triggerNotification("Подсказка успешно куплена из буфера!", "success");
                    } catch(e) { 
                        triggerNotification("Ошибка покупки", "error"); 
                        return; 
                    }
                }
                setUnlockedHints(prev => ({...prev, [idx]: true}));
            };

            const buyItem = async (itemId) => {
                try {
                    const res = await fetch(`/api/shop/buy/${itemId}`, { method: "POST", headers: getHeaders() });
                    if (res.ok) {
                        const d = await res.json();
                        triggerNotification(`Приобретено: ${d.item_name}!`, "success");
                        loadData();
                    } else {
                        const d = await res.json();
                        triggerNotification(d.detail, "error");
                    }
                } catch (e) { triggerNotification("Ошибка сети.", "error"); }
            };

            const useConsumable = async (name) => {
                try {
                    const res = await fetch(`/api/inventory/use/${name}`, { method: "POST", headers: getHeaders() });
                    const d = await res.json();
                    triggerNotification(d.message, "success");
                    loadData();
                } catch (e) { triggerNotification("Ошибка активации.", "error"); }
            };

            const discardItem = async (name) => {
                try {
                    const res = await fetch(`/api/inventory/discard/${name}`, { method: "POST", headers: getHeaders() });
                    if (res.ok) {
                        triggerNotification("Предмет утилизирован.", "success");
                        loadData();
                    }
                } catch (e) { triggerNotification("Ошибка.", "error"); }
            };

            const isGpsVerified = activeQuest ? activeQuest.gps_verified : false;
            const npcNode = activeQuest?.current_npc_node ? activeQuest.step?.npc_dialogue?.[activeQuest.current_npc_node] : null;
            const hasNpc = Boolean(npcNode);

            return (
                <div class="max-w-md mx-auto pb-24 relative min-h-screen flex flex-col justify-between">
                    
                    {/* ОЧЕРЕДЬ УВЕДОМЛЕНИЙ (СТЕК) */}
                    <div class="fixed top-4 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
                        {notifications.map(n => (
                            <div key={n.id} class={`p-4 rounded-xl shadow-lg border text-white font-medium flex items-start justify-between transition-all duration-300 pointer-events-auto ${n.type === "success" ? "bg-emerald-600 border-emerald-500" : "bg-rose-600 border-rose-500"}`}>
                                {/* whitespace-pre-wrap позволяет выводить форматированный текст с переносами строк */}
                                <span class="text-sm whitespace-pre-wrap leading-relaxed">{n.text}</span>
                                <button onClick={() => setNotifications(prev => prev.filter(x => x.id !== n.id))} class="text-white hover:text-gray-200 shrink-0 ml-3">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ))}
                    </div>

                    {/* МОДАЛКА ВЫБОРА КЛАССА */}
                    {showClassModal && (
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm">
                                <h3 class="text-lg font-bold text-white mb-4">Выберите путь</h3>
                                <div class="space-y-3">
                                    <button onClick={() => changeClass('merchant')} class="w-full text-left p-3 bg-slate-800 rounded-xl hover:bg-slate-700">
                                        <div class="font-bold text-amber-400">💰 Купец</div>
                                        <div class="text-xs text-slate-400">+20% золота за контрольные точки</div>
                                    </button>
                                    <button onClick={() => changeClass('ranger')} class="w-full text-left p-3 bg-slate-800 rounded-xl hover:bg-slate-700">
                                        <div class="font-bold text-emerald-400">🏹 Следопыт</div>
                                        <div class="text-xs text-slate-400">Ускоренная перезарядка бесплатных подсказок</div>
                                    </button>
                                    <button onClick={() => changeClass('historian')} class="w-full text-left p-3 bg-slate-800 rounded-xl hover:bg-slate-700">
                                        <div class="font-bold text-blue-400">📜 Историк</div>
                                        <div class="text-xs text-slate-400">Удвоенные очки рейтинга (score)</div>
                                    </button>
                                </div>
                                <button onClick={() => setShowClassModal(false)} class="mt-4 w-full py-2 bg-rose-600/20 text-rose-400 rounded-xl font-bold">Отмена</button>
                            </div>
                        </div>
                    )}

                    <header class="p-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🗺</span>
                            <div>
                                <h1 class="text-md font-bold tracking-tight text-white leading-none">Perm Quest</h1>
                                <span class="text-[11px] text-slate-400 font-medium">Telegram Mini App v2.0</span>
                            </div>
                        </div>
                        {profile && (
                            <div class="flex items-center gap-3">
                                <div class="bg-indigo-950 border border-indigo-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                                    <span class="text-amber-300 font-extrabold text-sm">Монеты</span>
                                    <span class="text-amber-400 text-sm">{COIN_SYMBOL}</span>
                                    <span class="text-amber-300 font-extrabold text-sm">{profile.coins ?? 0}</span>
                                </div>
                            </div>
                        )}
                    </header>

                    <main class="p-4 flex-grow">
                        {loading && (
                            <div class="flex flex-col items-center justify-center py-24 gap-4">
                                <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                                <span class="text-slate-400 font-medium">Загрузка данных Перми...</span>
                            </div>
                        )}

                        {!loading && activeTab === "quest" && (
                            <div>
                                {/* КВЕСТ НЕ ЗАПУЩЕН */}
                                {!activeQuest && (
                                    <div class="space-y-4">
                                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                            <h3 class="text-lg font-bold text-white mb-2">🚶‍♂️ Доступные пешие треки по Перми</h3>
                                            <p class="text-sm text-slate-400 mb-4">Выберите один из готовых маршрутов, чтобы начать увлекательное расследование прямо на улицах города.</p>
                                        </div>
                                        <div class="grid gap-3">
                                            {quests.map((q) => (
                                                <div key={q.id} class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex flex-col justify-between gap-3">
                                                    <div>
                                                        <div class="flex justify-between items-start mb-1">
                                                            <h4 class="font-bold text-md text-indigo-400">{q.title}</h4>
                                                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300">
                                                                Lvl {q.min_level_required}+
                                                            </span>
                                                        </div>
                                                        <p class="text-xs text-slate-400 line-clamp-2">{q.description}</p>
                                                    </div>
                                                    <button 
                                                        disabled={q.is_locked}
                                                        onClick={() => startQuest(q.id)}
                                                        class={`w-full py-2.5 rounded-xl font-bold text-sm tracking-wide ${
                                                            q.is_locked 
                                                            ? "bg-slate-800 text-slate-500 cursor-not-allowed" 
                                                            : "bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-950/40"
                                                        }`}
                                                    >
                                                        {q.is_locked ? "🔒 Недостаточный уровень" : "🏃‍♂️ Начать приключение"}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* ИДЕТ КВЕСТ */}
                                {activeQuest && (
                                    <div class="space-y-4">
                                        
                                        {/* ПАНЕЛЬ СИМУЛЯТОРА GPS */}
                                        <div class="bg-indigo-950/40 border border-indigo-800/60 p-4 rounded-2xl space-y-3">
                                            <div class="flex items-center justify-between">
                                                <span class="text-xs font-bold text-indigo-300 uppercase tracking-wider">GPS Симулятор</span>
                                                <button 
                                                    onClick={() => setMockGps(!mockGps)}
                                                    class="text-xs font-extrabold text-white bg-indigo-800 px-3 py-1 rounded"
                                                >
                                                    {mockGps ? "🔌 Вкл. Реал GPS" : "⚙️ Симулятор"}
                                                </button>
                                            </div>
                                            {mockGps && (
                                                <div class="grid grid-cols-2 gap-2">
                                                    <button 
                                                        onClick={() => {
                                                            setCoords({ latitude: activeQuest.step.latitude, longitude: activeQuest.step.longitude });
                                                            setCurrentDistance(0);
                                                        }} 
                                                        class="bg-slate-800 text-white py-1.5 rounded text-xs font-semibold"
                                                    >
                                                        📍 Прыгнуть к цели
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            setCoords({ latitude: activeQuest.step.latitude + 0.002, longitude: activeQuest.step.longitude - 0.003 });
                                                            setCurrentDistance(350);
                                                        }}
                                                        class="bg-slate-800 text-white py-1.5 rounded text-xs font-semibold"
                                                    >
                                                        🚶‍♂️ Отойти на 350м
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        {/* РАДАР (ПОКАЗЫВАЕТСЯ ДО ПОДТВЕРЖДЕНИЯ GPS) */}
                                        {!isGpsVerified && (
                                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col items-center text-center space-y-4">
                                                <div class="relative w-28 h-28 border-4 border-indigo-600/40 rounded-full flex items-center justify-center animate-pulse">
                                                    <div class="absolute inset-2 border-2 border-indigo-500 rounded-full"></div>
                                                    <span class="text-4xl">🛰</span>
                                                </div>
                                                <div>
                                                    <h3 class="text-md font-bold text-white">📡 Живой радар</h3>
                                                    <p class="text-xs text-slate-400 mt-1">До Контрольной точки:</p>
                                                    <span class="text-2xl font-black text-indigo-400 mt-2 block">
                                                        {currentDistance !== null ? `${currentDistance} метров` : "Поиск GPS..."}
                                                    </span>
                                                </div>
                                                <button 
                                                    onClick={verifyPosition}
                                                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm tracking-wide px-6 py-3 rounded-xl shadow-lg shadow-indigo-950/40"
                                                >
                                                    📍 Подтвердить прибытие
                                                </button>
                                            </div>
                                        )}

                                        {/* СЦЕНАРИЙ ДИАЛОГА С NPC (ПОСЛЕ GPS) */}
                                        {isGpsVerified && hasNpc && (
                                            <div class="bg-slate-950 border border-indigo-900/80 p-5 rounded-2xl space-y-4">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-10 h-10 rounded-full bg-indigo-950 border border-indigo-800 flex items-center justify-center text-lg">🗣</div>
                                                    <div>
                                                        <h4 class="font-extrabold text-sm text-indigo-400 uppercase tracking-widest">{activeQuest.step.npc_name}</h4>
                                                        <span class="text-[10px] text-slate-500 font-bold">Интерактивный персонаж</span>
                                                    </div>
                                                </div>
                                                <p class="text-sm font-semibold text-white leading-relaxed italic">
                                                    «{npcNode?.text}»
                                                </p>
                                                <div class="grid gap-2">
                                                    {npcNode?.options?.map((opt, idx) => (
                                                        <button 
                                                            key={idx}
                                                            onClick={() => selectNpcChoice(idx)}
                                                            class="text-left w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white flex justify-between items-center"
                                                        >
                                                            <span>{opt.text}</span>
                                                            <span class="text-[10px] text-slate-500 shrink-0 ml-2">выбрать →</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* ЗАГАДКА И ВВОД ОТВЕТА (ПОСЛЕ GPS, ЕСЛИ НЕТ NPC ИЛИ ОН ЗАКОНЧИЛСЯ) */}
                                        {isGpsVerified && !hasNpc && (
                                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                                                <div class="space-y-1">
                                                    <span class="text-[10px] uppercase font-bold tracking-widest text-indigo-400">Сюжетная загадка</span>
                                                    <h4 class="text-md font-bold text-white leading-relaxed">{activeQuest.step.instruction_text}</h4>
                                                </div>

                                                {/* СЛАЙДЕР БЫЛО/СТАЛО */}
                                                {activeQuest.step.photo_then_id && (
                                                    <div class="space-y-1">
                                                        <span class="text-[10px] uppercase font-bold tracking-widest text-indigo-400">Ракурс времени</span>
                                                        <div 
                                                            ref={sliderRef}
                                                            onMouseMove={handleMouseMove}
                                                            onTouchMove={handleTouchMove}
                                                            onMouseDown={handleMouseDown}
                                                            onMouseUp={handleMouseUp}
                                                            onMouseLeave={handleMouseUp}
                                                            class="slider-container w-full h-48 rounded-xl border border-slate-800"
                                                        >
                                                            <img src="https://images.unsplash.com/photo-1590073844006-33379778ae09?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover" alt="Сейчас" />
                                                            <div class="slider-before" style={{ clipPath: `polygon(0 0, ${sliderValue}% 0, ${sliderValue}% 100%, 0 100%)` }}>
                                                                <img src="https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover" alt="Тогда" />
                                                            </div>
                                                            <div class="slider-handle" style={{ left: `${sliderValue}%` }}>
                                                                <div class="slider-circle"><span class="text-[10px] font-bold text-white">↔</span></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}

                                                <div class="pt-2">
                                                    <input 
                                                        type="text" 
                                                        value={userAns}
                                                        onChange={(e) => setUserAns(e.target.value)}
                                                        placeholder="Ваш текстовый ответ..."
                                                        class="w-full bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-sm font-semibold text-white placeholder-slate-500 focus:border-indigo-600 mb-3 outline-none"
                                                    />
                                                    <button 
                                                        onClick={submitAnswer}
                                                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm py-3 rounded-xl shadow-lg"
                                                    >
                                                        🚀 Отправить ответ
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {/* ПОДСКАЗКИ (АКТИВНЫ ТОЛЬКО ПОСЛЕ GPS) */}
                                        {isGpsVerified && activeQuest.step.hints && activeQuest.step.hints.length > 0 && (
                                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
                                                <h4 class="text-xs font-bold uppercase tracking-widest text-amber-400">💡 Система подсказок</h4>
                                                <div class="grid gap-2">
                                                    {activeQuest.step.hints.map((hint, idx) => {
                                                        const isUnlocked = unlockedHints[idx];
                                                        const delaySec = hint.delay || 0;
                                                        const price = hint.price || 0;
                                                        const timeRemaining = Math.max(0, delaySec - timeElapsed);
                                                        
                                                        if (isUnlocked) {
                                                            return <div key={idx} class="bg-indigo-950/50 p-3 rounded-xl border border-indigo-900/50 text-sm text-indigo-200">{"🔎 " + hint.text}</div>;
                                                        }
                                                        if (price > 0) {
                                                            return <button key={idx} onClick={() => unlockHint(idx, true)} class="w-full text-left p-3 bg-amber-600/20 text-amber-400 rounded-xl font-bold text-xs">💰 Купить подсказку из буфера ({price} {COIN_LABEL})</button>;
                                                        }
                                                        if (timeRemaining > 0) {
                                                            const mins = Math.floor(timeRemaining / 60);
                                                            const secs = Math.floor(timeRemaining % 60);
                                                            return <button key={idx} disabled class="w-full text-left p-3 bg-slate-800 text-slate-500 rounded-xl font-bold text-xs">⏳ Откроется через {mins}:{secs < 10 ? '0':''}{secs}</button>;
                                                        }
                                                        return <button key={idx} onClick={() => unlockHint(idx, false)} class="w-full text-left p-3 bg-indigo-600/20 text-indigo-400 rounded-xl font-bold text-xs">💡 Открыть бесплатную подсказку</button>;
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        {/* КНОПКА ПРЕРЫВАНИЯ КВЕСТА */}
                                        <div class="pt-2 pb-6">
                                            <button 
                                                onClick={exitQuest}
                                                class="w-full bg-rose-950/50 hover:bg-rose-900/60 border border-rose-900 text-rose-500 font-bold text-sm tracking-wide py-3 rounded-xl transition-all"
                                            >
                                                🛑 Прервать квест (Сброс прогресса)
                                            </button>
                                        </div>

                                    </div>
                                )}
                            </div>
                        )}

                        {/* ВКЛАДКА ПРОФИЛЯ */}
                        {!loading && activeTab === "profile" && profile && (
                            <div class="space-y-4">
                                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col items-center text-center space-y-3">
                                    <div class="w-16 h-16 bg-indigo-950 border border-indigo-800 rounded-full flex items-center justify-center text-3xl shadow-inner">
                                        👤
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-black text-white">{profile.full_name}</h3>
                                        <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase">{profile.rpg_class}</span>
                                    </div>
                                </div>

                                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-bold text-slate-400 uppercase">Уровень персонажа</span>
                                        <span class="text-sm font-black text-white">{profile.level} Lvl</span>
                                    </div>
                                    <div class="space-y-1">
                                        <div class="flex justify-between text-[11px] font-extrabold text-slate-500 uppercase">
                                            <span>Опыт (XP)</span>
                                            <span>{profile.xp} / {profile.xp_needed} XP</span>
                                        </div>
                                        <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-900">
                                            <div class="bg-indigo-500 h-full rounded-full" style={{ width: `${Math.min(100, (profile.xp / profile.xp_needed) * 100)}%` }}></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <button onClick={() => setShowClassModal(true)} class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg">
                                        {profile.rpg_class === "Не выбран" ? "🎭 Выбрать RPG-класс" : "🎭 Сменить класс"}
                                    </button>
                                    <button onClick={claimIncome} class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg">
                                        Собрать {profile.income_buffer} {COIN_LABEL}
                                    </button>
                                </div>

                                {/* Заглушки будущих обновлений */}
                                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
                                    <h4 class="text-xs font-extrabold text-slate-500 uppercase tracking-widest mb-2">🌟 В разработке (Скоро)</h4>
                                    <div class="flex items-center gap-3 text-slate-400 text-sm font-bold bg-slate-950 p-3 rounded-xl border border-slate-800/50 opacity-60">
                                        <span>⚔️</span><span>Гильдии и кланы</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-slate-400 text-sm font-bold bg-slate-950 p-3 rounded-xl border border-slate-800/50 opacity-60">
                                        <span>🏆</span><span>PvP Дуэли на знания</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-slate-400 text-sm font-bold bg-slate-950 p-3 rounded-xl border border-slate-800/50 opacity-60">
                                        <span>📱</span><span>AR Сканер зданий</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ВКЛАДКА ИНВЕНТАРЯ (РЮКЗАК) */}
                        {!loading && activeTab === "inventory" && (
                            <div class="space-y-4">
                                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                    <div class="flex justify-between text-xs font-bold uppercase text-slate-400 mb-2">
                                        <span>Грузоподъемность рюкзака</span>
                                        <span>{inventory.current_weight} / {profile?.max_weight_capacity || 10} кг</span>
                                    </div>
                                    <div class="w-full bg-slate-950 h-3 rounded-full overflow-hidden border border-slate-900 mb-1">
                                        <div 
                                            class={`h-full rounded-full ${inventory.current_weight > (profile?.max_weight_capacity || 10) ? "bg-rose-600" : "bg-indigo-500"}`}
                                            style={{ width: `${Math.min(100, (inventory.current_weight / (profile?.max_weight_capacity || 10)) * 100)}%` }}
                                        ></div>
                                    </div>
                                    {inventory.current_weight > (profile?.max_weight_capacity || 10) && (
                                        <span class="text-[10px] text-rose-500 font-extrabold uppercase mt-1 block">🚨 Рюкзак перегружен! Продвижение по квестам заблокировано.</span>
                                    )}
                                </div>

                                <div class="space-y-2">
                                    {inventory.items.length === 0 ? (
                                        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
                                            <span class="text-4xl">🎒</span>
                                            <h4 class="font-bold text-white mt-2">Рюкзак пуст</h4>
                                            <p class="text-xs text-slate-500 mt-1">Ищите артефакты на локациях города.</p>
                                        </div>
                                    ) : (
                                        inventory.items.map((item, idx) => (
                                            <div key={idx} class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-3">
                                                <div class="flex items-center gap-3">
                                                    <span class="text-2xl">📦</span>
                                                    <div>
                                                        <h4 class="font-bold text-white text-sm">{item}</h4>
                                                        <span class="text-[10px] text-slate-500 uppercase font-bold">Артефакт</span>
                                                    </div>
                                                </div>
                                                <div class="flex gap-2">
                                                    {item.includes("Эликсир") && (
                                                        <button onClick={() => useConsumable(item)} class="bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">Выпить</button>
                                                    )}
                                                    <button onClick={() => discardItem(item)} class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-rose-400 text-[11px] font-bold px-3 py-1.5 rounded-lg">Сбросить</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ВКЛАДКА МАГАЗИНА */}
                        {!loading && activeTab === "shop" && (
                            <div class="space-y-4">
                                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                    <h3 class="text-lg font-bold text-white mb-2">🏪 Глобальный магазин</h3>
                                    <p class="text-xs text-slate-400">Обменивайте монеты на сюжетные реликвии, премиум-билеты или расходные материалы.</p>
                                </div>

                                <div class="grid gap-3">
                                    {shop.map((item) => (
                                        <div key={item.id} class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex flex-col justify-between gap-3">
                                            <div>
                                                <div class="flex justify-between items-start mb-1">
                                                    <h4 class="font-bold text-md text-white">{item.name}</h4>
                                                    <span class="text-sm font-extrabold text-amber-400">{item.price} {COIN_LABEL}</span>
                                                </div>
                                                <p class="text-xs text-slate-400 leading-normal">{item.description}</p>
                                                <div class="flex gap-3 mt-2 text-[10px] text-slate-500 font-bold uppercase tracking-wider">
                                                    <span>⚖️ Вес: {item.weight} кг</span>
                                                    {item.generates_income && <span class="text-emerald-500">💰 Пассив: +{item.income_per_hour} {COIN_LABEL}/ч</span>}
                                                </div>
                                            </div>
                                            <button onClick={() => buyItem(item.id)} class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-bold">Купить за {item.price} {COIN_LABEL}</button>
                                        </div>
                                    ))}
                                </div>
                                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-3">
                                    <span class="text-2xl">📍</span>
                                    <div>
                                        <h4 class="text-sm font-bold text-white">Торговые лавки на карте</h4>
                                        <p class="text-xs text-slate-400">Географические скупщики пока находятся в разработке для TMA. Ожидайте обновления!</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ВКЛАДКА РЕЙТИНГА */}
                        {!loading && activeTab === "rating" && (
                            <div class="space-y-4">
                                <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-900">
                                    {["global", "month", "year"].map((p) => (
                                        <button 
                                            key={p}
                                            onClick={() => setLeaderboardPeriod(p)}
                                            class={`flex-1 py-1.5 text-xs font-bold rounded-lg uppercase tracking-wider transition-all duration-200 ${leaderboardPeriod === p ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
                                        >
                                            {p === "global" ? "Глобальный" : p === "month" ? "Месяц" : "Год"}
                                        </button>
                                    ))}
                                </div>

                                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden divide-y divide-slate-800">
                                    {leaderboard.length === 0 ? (
                                        <div class="p-8 text-center text-xs text-slate-500">В этой категории пока нет рекордов.</div>
                                    ) : (
                                        leaderboard.map((user, idx) => (
                                            <div key={idx} class="p-4 flex items-center justify-between gap-3">
                                                <div class="flex items-center gap-3">
                                                    <span class={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-black ${idx === 0 ? "bg-amber-400 text-slate-950" : idx === 1 ? "bg-slate-300 text-slate-950" : idx === 2 ? "bg-amber-700 text-white" : "bg-slate-800 text-slate-400"}`}>
                                                        {idx + 1}
                                                    </span>
                                                    <div>
                                                        <h4 class="font-bold text-white text-sm">{user.full_name}</h4>
                                                        <span class="text-[10px] text-slate-400 font-bold uppercase">{user.title} | Lvl {user.level}</span>
                                                    </div>
                                                </div>
                                                <span class="text-sm font-black text-indigo-400">{user.total_score}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* ТАББАР */}
                    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-2.5 px-6 flex justify-between z-40">
                        {[
                            { id: "quest", icon: "compass", label: "Квест" },
                            { id: "profile", icon: "user", label: "Профиль" },
                            { id: "inventory", icon: "package", label: "Рюкзак" },
                            { id: "shop", icon: "shopping-bag", label: "Магазин" },
                            { id: "rating", icon: "trophy", label: "Рейтинг" }
                        ].map((tab) => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                class={`flex flex-col items-center gap-1 bg-transparent border-none outline-none cursor-pointer transition-all duration-200 ${
                                    activeTab === tab.id ? "text-indigo-400 scale-105" : "text-slate-400 hover:text-slate-200"
                                }`}
                            >
                                <i data-lucide={tab.icon} class="w-5 h-5"></i>
                                <span class="text-[9px] font-extrabold uppercase tracking-widest">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
